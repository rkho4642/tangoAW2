[package]
name = "tango-gamesupport-common-dataview"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

# The save/ROM parsing substrate (formerly the public tango-dataview
# crate): the traits every game crate implements against, plus headless
# save preparation and validation. Headless-safe — no UI toolkit
# anywhere below this crate.

[dependencies]
tango-gamesupport = { path = "../tango-gamesupport" }
bytemuck = { workspace = true, features = ["derive"] }
byteorder.workspace = true
c2rust-bitfields.workspace = true
image.workspace = true
thiserror.workspace = true

[lints]
workspace = true
