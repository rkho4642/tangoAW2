[package]
name = "tango-library"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

# The user's game library and its persistence, extracted from the tango
# bin crate so a second frontend (a browser build over IndexedDB) reuses the
# registry, the scanners, the patch catalog, and the config model
# verbatim. Editors are optional (`ui`). No direct filesystem or HTTP access: all
# I/O goes through the `storage::Storage` / `http::Http` traits, whose
# std implementations are behind the default `native` feature. Builds
# for native AND wasm32.
[dependencies]
tango-match = { path = "../tango-match" }
tango-net-protocol = { path = "../tango-net-protocol" }
tango-gamesupport-common-dataview = { path = "../tango-gamesupport-common-dataview" }
log.workspace = true
mailparse.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
unic-langid.workspace = true
# `std::time::Instant` panics in a browser; used for rescan timing logs.
web-time.workspace = true

bps.workspace = true
tango-gamesupport = { path = "../tango-gamesupport" }
tango-patch = { workspace = true, features = ["package", "index"] }
tango-replay = { path = "../tango-replay" }

fluent-templates.workspace = true

tango-gamesupport-aw2 = { path = "../tango-gamesupport-aw2", optional = true }

# The `native` feature's std implementations only. Nothing outside
# `storage::std_impl` / `http::reqwest_impl` may reference these,
# or the wasm32 build breaks.
futures = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["stream"], optional = true }
tokio = { workspace = true, features = ["time"], optional = true }
walkdir = { workspace = true, optional = true }

[dev-dependencies]
num-rational.workspace = true
# The library never writes a package; the patch tests build one to scan,
# and stand up a real HTTP server to fetch it from.
tango-patch = { workspace = true, features = ["package", "index", "bundle"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

[features]
default = ["native"]
# Attach editors only for games selected by gamesupport-*; enabling UI alone
# does not pull in any games. The registry owns both feature paths.
ui = [
    "tango-gamesupport/ui",
    "tango-gamesupport-aw2?/ui",
]
# std filesystem + reqwest HTTP. A wasm build
# turns this off and supplies its own IndexedDB / fetch implementations.
native = ["dep:futures", "dep:reqwest", "dep:tokio", "dep:walkdir", "reqwest/native-tls"]
gamesupport-aw2 = ["dep:tango-gamesupport-aw2"]
gamesupport-all = [
    "gamesupport-aw2",
]

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = [
    "tango-gamesupport-aw2",
]
