[package]
name = "tango-gamesupport-common-ui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

# The save editor: the shell implementing the public
# `tango_gamesupport::SaveEditor` embedding API, its view (the
# streamer-mode cover around a game's body), the save model it reads,
# and the editor's fluent bundle. A crate of its own so the feature
# flagging lives at the per-game aggregators — nothing in here is cfg'd.

[dependencies]
tango-gamesupport = { path = "../tango-gamesupport", features = ["ui"] }
tango-gamesupport-common-dataview = { path = "../tango-gamesupport-common-dataview" }
tango-ui = { path = "../tango-ui" }
iced.workspace = true
lucide-icons.workspace = true
fluent-templates.workspace = true
unic-langid.workspace = true

[lints]
workspace = true
